intro: |
  Architect, hands-on builder, and engineering leader with 15 years across enterprise platforms (PUMA), a €3.5M EU manufacturing consortium, and a PhD in federated data architecture. I anchor in architecture: designing metadata-driven, AI-native systems that absorb change without breaking the products built on them — and I set the engineering practices that let teams of any seniority build with reliably.

l2: |
  Currently co-founder of a production healthcare app ([Pflegebericht.com](http://www.pflegebericht.com)), where I own architecture and engineering end-to-end and also apply what I've learned about building reliably with AI-assisted development — practical evidence I bring into how I design systems and set engineering practice, not a separate specialty.

  Before that: Lead Solution Architect at PUMA (two engineering teams, performance and reliability programs), and a €3.5M EU aerospace-manufacturing consortium where I designed and directed cross-organizational data sharing between 8 partners in 5 countries — work my PhD on federated data architecture later formalized.

  **## Selected work**

  - **[Pflegebericht.com](http://www.pflegebericht.com)** (2025–present) — co-founded a care-documentation app for German Verhinderungspflege carers; own product, architecture, and engineering. Live product.
  - **[PUMA.com](https://www.puma.com)** (2024–25) — Lead Solution Architect, two engineering teams, performance and reliability programs.
  - **[SIMUTOOL](https://github.com/simutool)** (2015–21) — €3.5M EU aerospace consortium, cross-organization data systems.
  - **PhD (Bamberg, 2023)** — federated (meta)data architecture.
  - **Lomisoft** (2025) — architecture advisory for early-stage healthcare SaaS.

  **## Where I'm strongest**

  - **Solution & platform architecture.** System design, data platforms, integration, and technical roadmaps — from a €3.5M multi-partner consortium to a production company platform.
  - **Data architecture.** Federated data sharing, governance, and interoperability — doctoral research through production systems.
  - **Technical leadership.** Leading engineering teams, stakeholder alignment, and delivery — with hands-on building when it's useful, including current, practical fluency in AI-assisted engineering.

