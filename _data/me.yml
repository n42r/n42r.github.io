intro: |
  Architect, hands-on builder, and engineering leader with 15 years across enterprise platforms (PUMA), a €3.5M EU manufacturing consortium, and a PhD in federated data architecture. I anchor in architecture: designing metadata-driven, AI-native systems that absorb change without breaking the products built on them — and I set the engineering practices that let teams of any seniority build with reliably. Currently co-founder of a production healthcare app ([Pflegebericht.com](http://www.pflegebericht.com)) built with an AI-first methodology I designed: architecture conventions that keep AI agents effective, quality gates that catch AI-generated drift, and the human-architect role that maintains system coherence.

l2: |
  Before that: Lead Solution Architect at PUMA (two engineering teams, performance and reliability programs, early AI/LLM tooling pilots), and a €3.5M EU aerospace-manufacturing consortium where I designed and directed cross-organizational data sharing between 8 partners in 5 countries — work my PhD on federated data architecture formalized.

  I'm now bringing all three together inside an organization: architecture as the anchor role, AI-native engineering and data as the specialty, collaboration and coaching as the operating mode.

l3: |
  **## Selected work**

  - **[Pflegebericht.com](http://www.pflegebericht.com)** (2025–present) — co-founded a care-documentation app for German Verhinderungspflege carers; built with an AI-assisted engineering methodology I designed. Live product.
  - **[PUMA.com](https://www.puma.com)** (2024–25) — Lead Solution Architect, two engineering teams, performance and reliability programs.
  - **[SIMUTOOL](https://github.com/simutool)** (2015–21) — €3.5M EU aerospace consortium, cross-organization data systems.
  - **PhD (Bamberg, 2023)** — federated (meta)data architecture.
  - **Lomisoft** (2025) — architecture advisory for early-stage healthcare SaaS.

  **## Where I'm strongest**

  - **AI-native engineering.** I design the practices that make AI-assisted development work in production: architecture conventions that keep AI agents effective, quality gates for AI-generated drift, harness and documentation design.
  - **Data & platform architecture.** Metadata-driven systems, federated data sharing, governance and interoperability — from doctoral research to production systems.
  - **Solution architecture & technical leadership.** Reliability, system design, technical-debt programs, roadmaps. Hands-on when useful.