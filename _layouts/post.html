---
layout: plain
---
<p class="post-meta">{% include read_time.html content=page.content %}</p>

{{ content }}

<p class="post-date">Published on {{ page.date | date: "%B %Y" }}</p>

<div class="post-footer">
  <hr />
  <p class="other-writing"><a href="{{ '/writing/' | relative_url }}">Other Writings &rarr;</a></p>
  <div class="post-author">
    <h2 class="name"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h2>
    <p class="headline">{{ site.headline }}</p>
    <div class="links">
      <a href="mailto:{{ site.email }}">Contact</a>
      <span class="sep">&middot;</span>
      <a href="https://www.linkedin.com/in/{{ site.linkedin }}">LinkedIn</a>
    </div>
  </div>
</div>
